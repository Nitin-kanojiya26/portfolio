<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- High-contrast rounded badge for visibility in both light & dark browser chrome -->
  <rect width="64" height="64" rx="14" fill="#0f1115" stroke="#333842" stroke-width="1.5" />
  
  <!-- CRT Monitor Outer Casing -->
  <rect x="11" y="9" width="42" height="32" rx="4" fill="#1e2229" stroke="#00e5ff" stroke-width="2.5" />
  
  <!-- Inner CRT Screen -->
  <rect x="15" y="13" width="34" height="24" rx="2" fill="#050608" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1" />
  
  <!-- Terminal Prompt >_ -->
  <path d="M20 20 L25 25 L20 30" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="28" y1="30" x2="35" y2="30" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Monitor Stand Neck & Base -->
  <rect x="28" y="41" width="8" height="5" fill="#1e2229" stroke="#00e5ff" stroke-width="1.5" />
  <rect x="21" y="46" width="22" height="3" rx="1.5" fill="#00e5ff" />
  
  <!-- Mechanical Retro Keyboard -->
  <path d="M12 51 L52 51 L48 59 L16 59 Z" fill="#1e2229" stroke="#00e5ff" stroke-width="1.8" />
  <line x1="20" y1="55" x2="44" y2="55" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 2" />
</svg>

